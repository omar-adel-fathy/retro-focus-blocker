<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Retro Focus Blocker</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <main class="shell">
    <section class="titlebar"><span>■ ■ ■</span><strong>FOCUS.EXE</strong><small>v1.2</small></section>

    <section class="screen">
      <div class="scanlines"></div>
      <p class="label">STATUS</p>
      <h1 id="statusText">Loading...</h1>
      <div id="countdown">--:--</div>
      <p id="subStatus">Booting...</p>
      <div class="meter"><div id="meterFill"></div></div>
    </section>

    <section class="panel">
      <label class="label">START TIMER</label>
      <div class="grid">
        <button type="button" data-mins="25">25m</button>
        <button type="button" data-mins="50">50m</button>
        <button type="button" data-mins="90">90m</button>
        <button type="button" data-mins="120">120m</button>
      </div>
      <div class="row">
        <input id="customMins" type="number" min="1" max="480" value="45" />
        <button id="startCustom" type="button">Start custom</button>
      </div>
      <div class="grid2">
        <button id="bioBreakBtn" type="button">2m water/bathroom</button>
        <button id="presenceBtn" type="button">Open guard</button>
      </div>
      <button id="stopBtn" type="button" class="danger">Stop current mode</button>
    </section>

    <section class="panel">
      <label class="label">REST</label>
      <div class="row">
        <input id="restMins" type="number" min="1" max="60" value="5" />
        <button id="startRestBtn" type="button">Start rest</button>
      </div>
    </section>

    <section class="panel">
      <label class="checkbox"><input id="hardMode" type="checkbox" /> Hard mode</label>
      <label class="checkbox"><input id="blockDuringRest" type="checkbox" /> Block sites during rest</label>
      <label class="checkbox"><input id="openSpotify" type="checkbox" /> Open Spotify when focus starts</label>
      <label class="checkbox"><input id="presenceAlways" type="checkbox" /> Guard siren even without focus timer</label>
      <label class="label">Missing seconds before siren</label>
      <input id="presenceMissingSeconds" type="number" min="5" max="90" value="18" />
      <label class="label">SPOTIFY URL</label>
      <input id="spotifyUrl" />
    </section>

    <section class="panel">
      <label class="label">BLOCKED SITES</label>
      <textarea id="blockedSites" rows="8"></textarea>
      <button id="saveBtn" type="button">Save settings</button>
    </section>
  </main>
  <script src="popup.js"></script>
</body>
</html>
